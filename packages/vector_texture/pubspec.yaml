name: vector_texture
description: >-
  Hoạ tiết chất liệu vẽ bằng code cho đồ hoạ vector (Flutter Canvas): lọn
  lông/bờm chảy theo trọng lực, lọn tóc xoăn, vảy rắn/rồng dọc thân, lông vũ
  xếp ngói. Chỉ tạo Path (có seed cố định) — tô màu do app quyết định.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  vector_anatomy:
    path: ../vector_anatomy

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
